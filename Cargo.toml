[package]
name = "guitar-smart-effecter"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[features]
default = ["asio"]
asio = ["cpal/asio"]

[dependencies]
cpal = "=0.18.2"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rtrb = "=0.4.0"
hound = "3.5"
png = "0.17"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.build-override]
debug = true

[profile.dev]
debug = 1
